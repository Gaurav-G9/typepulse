name: typepulse
description: AR Typing Platform companion — your typing history, speeds and insights from artypingplatform.com.
publish_to: "none"
version: 2.0.1+6

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.4
  workmanager: ^0.9.0+3
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/
