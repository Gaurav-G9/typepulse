name: typepulse
description: Personal typing tracker with live rooms and leaderboards. iOS-style UI on Android.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  uuid: ^4.5.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.4
  workmanager: ^0.9.0+3
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/
